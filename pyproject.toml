[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PySaiyanWeBoo"
version = "0.1.0"
description = "Shared CSS themes, semantic UI components, and small JavaScript utilities"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Optional focused test profile; default/full CI remains unchanged.
# Browser lanes (world-shared, successor-studios) add the Python Playwright client; its
# version must match the npm playwright in package.json, since they share one browser build.
world-test = ["pytest>=8", "anyio>=4.15.1", "playwright>=1.64.0", "pillow>=13.0.0"]
# Default sync: pytest and PyYAML only. Stagehand is browser tooling, opt-in via --group stagehand.
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "PyYAML>=6",
]
stagehand = [
    "stagehand>=4",
]
gradio = [
    "gradio>=6.30.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    "pillow>=13.0.0",
    "safehttpx>=0.2.0",
    "tomlkit>=0.15.2",
    "pyee>=13",
]

[tool.setuptools]
py-modules = ["web_ui"]
packages = []
