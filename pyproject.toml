[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-ui"
version = "0.1.0"
description = "Shared CSS themes, semantic UI components, and small JavaScript utilities"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "stagehand>=4",
    "PyYAML>=6",
]
gradio = [
    "gradio>=6.30.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]

[tool.uv]
override-dependencies = [
    "pillow>=13.0.0",
    "safehttpx>=0.2.0",
    "tomlkit>=0.15.2",
    "pyee>=13",
]

[tool.setuptools]
py-modules = ["web_ui"]
packages = []
