name: Local Gradio DOM
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@9e3da7ae1846e9604ebc24bb5178f7de094a4e77

  gradio-dom:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: b94f801a9c57b1914ff6b732519521a7a42fadfe
          path: .browser-test-kit-dom
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: 'true'
      - run: uv run --locked --group gradio python -m playwright install --with-deps --only-shell chromium
      - name: Verify jsDelivr Plotly load and figure render
        run: uv run --locked --group gradio python tests/integration/plotly_browser.py -v
      - name: Verify generated controls in Chromium
        run: uv run --locked --group gradio python tests/integration/controls_browser.py -v
      - name: Verify route-table navigation offline (file://) and over HTTP
        run: uv run --locked --group gradio python tests/integration/route_table_browser.py -v
      - name: Layout presets switch live and sweep to candidates (Chromium)
        run: uv run --locked --group gradio python tests/integration/layout_presets_browser.py -v
      - name: Compare Gradio DOM with shared extraction
        env:
          WEB_UI_GRADIO_TEST: '1'
          BTK_ROOT: .browser-test-kit-dom
          GRADIO_ANALYTICS_ENABLED: 'False'
          DOM_EVIDENCE_DIR: build/gradio-dom
        run: uv run --group gradio pytest -v tests/integration/test_gradio_dom.py --junitxml=build/gradio-dom/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gradio-dom-evidence
          path: build/gradio-dom
          if-no-files-found: error
