name: Tooling smoke
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python verification tools
        run: python -m pip install -r tests/requirements.txt
      - name: Verify GitHub CLI
        run: |
          git --version
          gh --version
      - name: Run pytest
        run: python -m pytest -v
      - name: Execute repository diagnostics renderer
        run: node tests/repository_diagnostics.node.js
      - name: Capture advisory tooling metadata
        run: python tool/tooling_meta.py > tooling-meta.json
      - uses: actions/upload-artifact@v7
        with:
          name: tooling-meta
          path: tooling-meta.json
          retention-days: 14
