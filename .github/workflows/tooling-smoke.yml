name: Tooling smoke
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1

  resolve-vendor:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
              Path(entry['destination']).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Stage canonical vendor evidence
        if: always()
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --kind locked --output build/vendor-evidence-candidate
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: build/vendor-evidence-candidate
          if-no-files-found: error
          retention-days: 14

  tooling:
    if: needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Load verified vendored GHI (stdlib only)
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('enrolled_ghi','tool/vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install Python verification tools
        run: python -m pip install -r tests/requirements.txt
      - name: Verify GitHub CLI
        run: |
          git --version
          gh --version
      - name: Fetch pinned test-only JUnit importer
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/xprobe
          ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          path: .junit-tools
          persist-credentials: false
          sparse-checkout: xprobe.py
          sparse-checkout-cone-mode: false
      - name: Run pytest
        env:
          WEB_UI_FAILURE_EVIDENCE: build/controlled-failure
        run: python -m pytest -v --junitxml=build/test-results/pytest-3.12.xml
      - name: Preserve junit-python-3.12
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-python-3.12
          path: build/test-results/pytest-3.12.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve junit-controlled-python-3.12
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-controlled-python-3.12
          path: build/controlled-failure/
          if-no-files-found: error
          retention-days: 14
      - name: Verify Node/Python flow diagram parity
        run: node --test tests/flow.node.cjs tests/flow-patch.node.cjs tests/layout-presets.node.cjs tests/types.node.cjs
      - name: Type-check the .d.cts declarations (pinned TypeScript)
        run: npx --yes -p typescript@7.0.2 tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 tests/types-usage.cts
      - name: Execute repository diagnostics renderer
        run: node tests/repository_diagnostics.node.js
      - name: Generate canonical repository metadata (stdlib only)
        run: python -S tool/vendor/gh_identity.py repo-metadata --format v1 --repository myon-bioinformatics/web-ui --root . --output-dir .
      - name: Capture advisory tooling metadata
        run: python tool/web_ui_tooling_meta.py > tooling-meta.json
      - uses: actions/upload-artifact@v7
        with:
          name: tooling-meta
          path: |
            tooling-meta.json
            repository-metadata.json
            repository-metadata.jsonl
          retention-days: 14

      - name: Stage canonical vendor evidence
        if: always()
        run: >-
          python -S .vendor-sync-tools/vendor_stage.py
          --kind locked --output build/vendor-evidence-test
      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-py3.12
          path: build/vendor-evidence-test
          if-no-files-found: error
          retention-days: 14

  test-locked:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@v7
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        ref: 1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
        path: .vendor-sync-tools
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Load verified vendored GHI (stdlib only)
      run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('enrolled_ghi','tool/vendor/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
    - uses: actions/setup-node@v7
      with:
        node-version: '26'
    - name: Install Python verification tools
      run: python -m pip install -r tests/requirements.txt
    - name: Verify GitHub CLI
      run: |
        git --version
        gh --version
    - name: Fetch pinned test-only JUnit importer
      uses: actions/checkout@v7
      with:
        repository: myon-bioinformatics/xprobe
        ref: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
        path: .junit-tools
        persist-credentials: false
        sparse-checkout: xprobe.py
        sparse-checkout-cone-mode: false
    - name: Run pytest
      run: python -m pytest -v
    - name: Execute repository diagnostics renderer
      run: node tests/repository_diagnostics.node.js
    - name: Generate canonical repository metadata (stdlib only)
      run: python -S tool/vendor/gh_identity.py repo-metadata --format v1 --repository myon-bioinformatics/web-ui --root . --output-dir .
    - name: Capture advisory tooling metadata
      run: python tool/web_ui_tooling_meta.py > tooling-meta.json
    - uses: actions/upload-artifact@v7
      with:
        name: locked-tooling-meta
        path: |
          tooling-meta.json
          repository-metadata.json
          repository-metadata.jsonl
        retention-days: 14
        if-no-files-found: error
    - name: Stage canonical vendor evidence
      if: always()
      run: python -S .vendor-sync-tools/vendor_stage.py --kind locked --output build/vendor-evidence-locked
    - name: Preserve vendor lock used by this run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-vendor-lock-py3.12
        path: build/vendor-evidence-locked
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20


  junit-identity:
    needs: [changes, tooling]
    if: (always()) && needs.changes.outputs.product_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@1eda992aa6fa31a902e2c06428e53ab17e8fe3c1
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-python-3.12/pytest-3.12.xml", "junit-controlled-python-3.12/junit.xml"]'
