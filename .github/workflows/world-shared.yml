name: Shared world board
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          python-version: '3.15'
          activate-environment: true
          enable-cache: true
          # Pull requests restore the cache and never write it; only main saves it.
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: uv pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_world_motion.py tests/test_world_shared.py tests/test_world_classroom.py
      - run: npm install --prefix build/shared --no-save --package-lock=false --ignore-scripts playwright@1.63.0
      - run: build/shared/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=build/shared/node_modules node tests/world_shared.browser.cjs
      - run: uv pip install playwright==1.63.0 "pillow>=13.0.0"
      - run: python tests/integration/school_browser.py -v
