name: Shared world board
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shared-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          python-version: '3.15'
          activate-environment: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # Python and npm Playwright come from uv.lock / package-lock.json at the same version,
      # so the one browser installed below serves both the Node and the Python tests.
      - run: PYTHONPATH=. uv run --locked --only-group world-test python -m pytest -q tests/test_world_motion.py tests/test_world_shared.py tests/test_world_classroom.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tests/world_shared.browser.cjs
      - run: uv run --locked --only-group world-test python tests/integration/school_browser.py -v
