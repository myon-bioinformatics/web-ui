name: UI smoke
on:
  push:
    branches: [main]
  pull_request:
jobs:
  changes:
    permissions:
      contents: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e

  # Tooling smoke already runs these unittest cases through pytest on Python 3.12.
  # Keep this workflow focused on real-browser capture and visual evidence.
  screenshot:
    if: needs.changes.outputs.product_changed == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out pinned browser-test-kit validators
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: 6a2e32a4bbe49be5268e6b30040d665a89eecf66
          path: .browser-test-kit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Clear prior capture evidence
        run: rm -rf screenshot-evidence web-ui-desktop-1440x900.png web-ui-mobile-390x844.png web-ui-contract-v1-desktop-1440x900.png web-ui-contract-v1-mobile-390x844.png web-ui-github-like-desktop-1440x900.png web-ui-github-like-mobile-390x844.png
      - run: npx --yes playwright@1.63.0 install --with-deps --only-shell chromium
      - name: Serve examples
        run: python3 -m http.server 8000 > /tmp/web-ui-http.log 2>&1 &
      - name: Wait for static server
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/examples/index.html"
          for attempt in range(50):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  if attempt == 49:
                      raise
                  time.sleep(0.1)
          PY
      - name: Capture desktop and mobile with Chromium
        run: |
          npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="1440,900" http://127.0.0.1:8000/examples/index.html web-ui-desktop-1440x900.png
          npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:8000/examples/index.html web-ui-mobile-390x844.png
          npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="1440,900" http://127.0.0.1:8000/contract/v1/example.html web-ui-contract-v1-desktop-1440x900.png
          npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:8000/contract/v1/example.html web-ui-contract-v1-mobile-390x844.png
          npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="1440,900" http://127.0.0.1:8000/examples/github-like.html web-ui-github-like-desktop-1440x900.png
          npx --yes playwright@1.63.0 screenshot --browser=chromium --viewport-size="390,844" http://127.0.0.1:8000/examples/github-like.html web-ui-github-like-mobile-390x844.png
      - name: Seal current-run capture receipt
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CAPTURE_STAGE: ${{ job.status == 'success' && 'complete' || 'failed' }}
        run: |
          mkdir -p screenshot-evidence
          if [ -f web-ui-desktop-1440x900.png ]; then cp web-ui-desktop-1440x900.png screenshot-evidence/; fi
          if [ -f web-ui-mobile-390x844.png ]; then cp web-ui-mobile-390x844.png screenshot-evidence/; fi
          if [ -f web-ui-contract-v1-desktop-1440x900.png ]; then cp web-ui-contract-v1-desktop-1440x900.png screenshot-evidence/; fi
          if [ -f web-ui-contract-v1-mobile-390x844.png ]; then cp web-ui-contract-v1-mobile-390x844.png screenshot-evidence/; fi
          if [ -f web-ui-github-like-desktop-1440x900.png ]; then cp web-ui-github-like-desktop-1440x900.png screenshot-evidence/; fi
          if [ -f web-ui-github-like-mobile-390x844.png ]; then cp web-ui-github-like-mobile-390x844.png screenshot-evidence/; fi
          python3 -S .browser-test-kit/scripts/write_capture_evidence.py screenshot-evidence --project chromium --captures web-ui-desktop-1440x900.png,web-ui-mobile-390x844.png,web-ui-contract-v1-desktop-1440x900.png,web-ui-contract-v1-mobile-390x844.png,web-ui-github-like-desktop-1440x900.png,web-ui-github-like-mobile-390x844.png --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --stage "$CAPTURE_STAGE"
      - name: Require all captures, hashes and current run identity
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -S .browser-test-kit/scripts/check_capture_evidence.py screenshot-evidence --expect chromium --captures web-ui-desktop-1440x900.png,web-ui-mobile-390x844.png,web-ui-contract-v1-desktop-1440x900.png,web-ui-contract-v1-mobile-390x844.png,web-ui-github-like-desktop-1440x900.png,web-ui-github-like-mobile-390x844.png --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prove rejection using copies of actual evidence
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -S .browser-test-kit/scripts/probe_capture_rejections.py screenshot-evidence --expect chromium --captures web-ui-desktop-1440x900.png,web-ui-mobile-390x844.png,web-ui-contract-v1-desktop-1440x900.png,web-ui-contract-v1-mobile-390x844.png,web-ui-github-like-desktop-1440x900.png,web-ui-github-like-mobile-390x844.png --sha "$EXPECTED_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve complete or failed receipts and images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-receipts
          path: screenshot-evidence
          retention-days: 14

      - name: Check visual regression candidates
        run: python3 scripts/check_visual_regression.py --candidate-dir .

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-ui-screenshots
          path: web-ui-*.png
          retention-days: 14
